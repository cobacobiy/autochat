services:
  shopee-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    image: shopee-autochat-bot:latest
    container_name: shopee-bot
    shm_size: 2gb

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "pgrep", "-f", "main.py"]
      interval: 30s
      timeout: 10s
      retries: 3

    environment:
      # Set to "false" when using VNC for manual login, "true" for headless ops
      - HEADLESS=false
      - PROFILE_DIR=/data/shopee-profile
      - POLL_INTERVAL=5           # seconds between chat poll cycles
      - OLLAMA_URL=http://ollama:11434

    volumes:
      # Persist Chromium session so login survives container restarts
      - shopee-bot-profile:/data/shopee-profile
      # Persist logs on the host for easy tailing
      - shopee-bot-logs:/data/logs

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      # noVNC web interface — open http://localhost:6080 to view/control the browser
      - "6080:6080"

    # Resource limits (adjust to your server)
    deploy:
      resources:
        limits:
          memory: 2g

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  shopee-bot-profile:
  shopee-bot-logs:
  ollama-data:
