services:
  shopee-bot:
    image: ${DOCKER_USERNAME:-cobacobiy}/shopee-autochat-bot:${IMAGE_TAG:-latest}
    container_name: shopee-bot
    shm_size: 2gb

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      - TZ=Asia/Jakarta
      - MAX_DAILY_REPLIES=${MAX_DAILY_REPLIES:-5000}

    volumes:
      # Persist Chromium session so login survives container restarts
      - shopee-bot-profile:/data/shopee-profile
      # Persist logs on the host for easy tailing
      - shopee-bot-logs:/data/logs
      # Bind mount the store knowledge base FAQ file
      - ./store_knowledge.txt:/app/store_knowledge.txt
      # Bind mount the unanswered questions log
      - ./unanswered_questions.txt:/app/unanswered_questions.txt

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      # noVNC web interface — open http://localhost:6080 to view/control the browser
      - "6080:6080"
      # Health endpoint API (Production)
      - "7080:8080"

    # Resource limits (adjust to your server)
    deploy:
      resources:
        limits:
          memory: 2g

