services:
  shopee-bot:
    image: ${DOCKER_USERNAME:-cobacobiy}/shopee-autochat-bot:${IMAGE_TAG:-latest}
    container_name: shopee-bot
    shm_size: 2gb

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "pgrep", "-f", "main.py"]
      interval: 30s
      timeout: 10s
      retries: 3

    environment:
      # Set to "false" when using VNC for manual login, "true" for headless ops
      - HEADLESS=false
      - PROFILE_DIR=/data/shopee-profile
      - POLL_INTERVAL=5           # seconds between chat poll cycles
      - OLLAMA_URL=http://ollama:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OLLAMA_MODEL=qwen2.5:3b
      - UNANSWERED_PATH=/app/unanswered_questions.txt
      - TZ=Asia/Jakarta
      - MAX_DAILY_REPLIES=${MAX_DAILY_REPLIES:-5000}

    volumes:
      # Persist Chromium session so login survives container restarts
      - shopee-bot-profile:/data/shopee-profile
      # Persist logs on the host for easy tailing
      - shopee-bot-logs:/data/logs
      # Bind mount the store knowledge base FAQ file
      - ./store_knowledge.txt:/app/store_knowledge.txt
      # Bind mount the unanswered questions log
      - ./unanswered_questions.txt:/app/unanswered_questions.txt

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      # noVNC web interface — open http://localhost:6080 to view/control the browser
      - "6080:6080"

    # Resource limits (adjust to your server)
    deploy:
      resources:
        limits:
          memory: 2g

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: [ "sh", "-c", "until ollama list; do sleep 1; done && ollama pull qwen2 && ollama pull qwen2.5:3b" ]

volumes:
  shopee-bot-profile:
  shopee-bot-logs:
  ollama-data:

