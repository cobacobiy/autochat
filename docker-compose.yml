services:
  shopee-bot:
    image: ${DOCKER_USERNAME:-cobacobiy}/shopee-autochat-bot:${IMAGE_TAG:-latest}
    container_name: shopee-bot
    shm_size: 2gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - HEADLESS=false
      - PROFILE_DIR=/data/shopee-profile
      - POLL_INTERVAL=4
      - OLLAMA_URL=http://ollama:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OLLAMA_MODEL=qwen2.5:3b
      - UNANSWERED_PATH=/app/unanswered_questions.txt
      - TZ=Asia/Jakarta
      - MAX_DAILY_REPLIES=${MAX_DAILY_REPLIES:-5000}
    volumes:
      - shopee-bot-profile:/data/shopee-profile
      - shopee-bot-logs:/data/logs
      - ./store_knowledge.txt:/app/store_knowledge.txt
      - ./unanswered_questions.txt:/app/unanswered_questions.txt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6080:6080"
      - "7080:8080"
    deploy:
      resources:
        limits:
          memory: 2g

  shopee-bot-2:
    image: ${DOCKER_USERNAME:-cobacobiy}/shopee-autochat-bot:${IMAGE_TAG:-latest}
    container_name: shopee-bot-2
    shm_size: 2gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - HEADLESS=false
      - PROFILE_DIR=/data/shopee-profile
      - POLL_INTERVAL=4
      - OLLAMA_URL=http://ollama:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OLLAMA_MODEL=qwen2.5:3b
      - UNANSWERED_PATH=/app/unanswered_questions.txt
      - TZ=Asia/Jakarta
      - MAX_DAILY_REPLIES=${MAX_DAILY_REPLIES:-5000}
      # SILAKAN GANTI DENGAN AKUN KEDUA KAKAK UNTUK AUTO-LOGIN:
      # - SHOPEE_USERNAME=isi_username_akun_2_disini
      # - SHOPEE_PASSWORD=isi_password_akun_2_disini
    volumes:
      - shopee-bot-profile-2:/data/shopee-profile
      - shopee-bot-logs-2:/data/logs
      - ./store_knowledge.txt:/app/store_knowledge.txt
      - ./unanswered_questions.txt:/app/unanswered_questions.txt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6082:6080"
      - "7082:8080"
    deploy:
      resources:
        limits:
          memory: 2g

  shopee-bot-3:
    image: ${DOCKER_USERNAME:-cobacobiy}/shopee-autochat-bot:${IMAGE_TAG:-latest}
    container_name: shopee-bot-3
    shm_size: 2gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - HEADLESS=false
      - PROFILE_DIR=/data/shopee-profile
      - POLL_INTERVAL=4
      - OLLAMA_URL=http://ollama:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OLLAMA_MODEL=qwen2.5:3b
      - UNANSWERED_PATH=/app/unanswered_questions.txt
      - TZ=Asia/Jakarta
      - MAX_DAILY_REPLIES=${MAX_DAILY_REPLIES:-5000}
      # SILAKAN GANTI DENGAN AKUN KETIGA KAKAK UNTUK AUTO-LOGIN:
      # - SHOPEE_USERNAME=isi_username_akun_3_disini
      # - SHOPEE_PASSWORD=isi_password_akun_3_disini
    volumes:
      - shopee-bot-profile-3:/data/shopee-profile
      - shopee-bot-logs-3:/data/logs
      - ./store_knowledge.txt:/app/store_knowledge.txt
      - ./unanswered_questions.txt:/app/unanswered_questions.txt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6083:6080"
      - "7083:8080"
    deploy:
      resources:
        limits:
          memory: 2g

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: [ "sh", "-c", "until ollama list; do sleep 1; done && ollama pull qwen2 && ollama pull qwen2.5:3b" ]

volumes:
  shopee-bot-profile:
  shopee-bot-logs:
  shopee-bot-profile-2:
  shopee-bot-logs-2:
  shopee-bot-profile-3:
  shopee-bot-logs-3:
  ollama-data:
