  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: [ "sh", "-c", "until ollama list; do sleep 1; done && ollama pull qwen2 && ollama pull qwen2.5:3b" ]

volumes:
  shopee-bot-profile:
  shopee-bot-logs:
  ollama-data:
  
