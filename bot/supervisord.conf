[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid

; ── Virtual display (Xvfb) ────────────────────────────────────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 1280x900x24
autorestart=true
priority=10
startsecs=2
stdout_logfile=/data/logs/xvfb.log
stderr_logfile=/data/logs/xvfb.log

; ── Window Manager (Fluxbox) ──────────────────────────────────────────────────
[program:fluxbox]
command=fluxbox -display :99
autorestart=true
priority=15
startsecs=2
stdout_logfile=/data/logs/fluxbox.log
stderr_logfile=/data/logs/fluxbox.log
; ── VNC server (exposes the virtual display) ──────────────────────────────────
[program:x11vnc]
command=sh -c 'if [ -n "$VNC_PASSWORD" ]; then exec x11vnc -display :99 -forever -passwd "$VNC_PASSWORD" -listen 0.0.0.0 -rfbport 5900; else exec x11vnc -display :99 -forever -nopw -listen 0.0.0.0 -rfbport 5900; fi'
autorestart=true
priority=20
startsecs=2
stdout_logfile=/data/logs/x11vnc.log
stderr_logfile=/data/logs/x11vnc.log

; ── noVNC (web-based VNC viewer on port 6080) ─────────────────────────────────
[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
autorestart=true
priority=30
startsecs=2
stdout_logfile=/data/logs/novnc.log
stderr_logfile=/data/logs/novnc.log

; ── Bot ───────────────────────────────────────────────────────────────────────
[program:shopee-bot]
command=python -m bot.main
environment=DISPLAY=":99"
autorestart=true
startretries=10
priority=40
stdout_logfile=/data/logs/bot.log
stderr_logfile=/data/logs/bot.log
