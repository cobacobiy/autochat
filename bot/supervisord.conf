[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid

; ── Virtual display (Xvfb) ────────────────────────────────────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 1280x900x24
autorestart=true
priority=10
stdout_logfile=/data/logs/xvfb.log
stderr_logfile=/data/logs/xvfb.log

; ── VNC server (exposes the virtual display) ──────────────────────────────────
[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -listen 0.0.0.0 -rfbport 5900
autorestart=true
priority=20
depends_on=xvfb
stdout_logfile=/data/logs/x11vnc.log
stderr_logfile=/data/logs/x11vnc.log

; ── noVNC (web-based VNC viewer on port 6080) ─────────────────────────────────
[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080
autorestart=true
priority=30
depends_on=x11vnc
stdout_logfile=/data/logs/novnc.log
stderr_logfile=/data/logs/novnc.log

; ── Bot ───────────────────────────────────────────────────────────────────────
[program:shopee-bot]
command=python /app/main.py
environment=DISPLAY=":99",HEADLESS="false"
autorestart=true
startretries=10
priority=40
depends_on=xvfb
stdout_logfile=/data/logs/bot.log
stderr_logfile=/data/logs/bot.log
