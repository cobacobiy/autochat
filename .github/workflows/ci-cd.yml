name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]

jobs:
  # ============================================
  # Job 1: Lint & Validasi Python
  # ============================================
  validate:
    if: github.event.action != 'closed'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python & Upgrade Pip
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "--version"], check=True)
          subprocess.run(["python", "-m", "pip", "install", "--upgrade", "pip", "--break-system-packages"], check=False)

      - name: Install Linter
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "-m", "pip", "install", "ruff", "--break-system-packages"], check=False)

      - name: Validasi Kode (Lint)
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "-m", "ruff", "check", "bot/"], check=True)

  # ============================================
  # Job 2: Build & Push Docker Image
  # ============================================
  build:
    if: github.event.action != 'closed'
    needs: validate
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set Image Tag
        id: tag
        shell: python
        run: |
          import os
          event_name = "${{ github.event_name }}"
          if event_name == "pull_request":
              sha = "${{ github.event.pull_request.head.sha }}"[:7]
              tag = f"pr-${{ github.event.pull_request.number }}-{sha}"
          else:
              sha = "${{ github.sha }}"[:7]
              tag = f"main-{sha}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"IMAGE_TAG={tag}\n")
          print(f"Image tag: {tag}")

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push
        shell: python
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          import os
          import subprocess
          
          docker_user = os.environ.get("DOCKER_USERNAME")
          if not docker_user:
              docker_user = "local"
              
          image = f"{docker_user}/shopee-autochat-bot:{os.environ.get('IMAGE_TAG')}"
          print(f"Building: {image}")
          
          subprocess.run(["docker", "build", "-t", image, "./bot"], check=True)
          
          if docker_user != "local":
              subprocess.run(["docker", "push", image], check=True)
              print(f"Image pushed: {image}")
          else:
              print(f"Skipping push: Docker Hub credentials not configured. Image built locally as {image}")

  # ============================================
  # Job 3: Deploy Preview (HANYA saat PR)
  # ============================================
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy Preview Container
        shell: python
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          import os
          import subprocess
          
          print("Deploying PR #${{ github.event.pull_request.number }} preview...")
          
          subprocess.run(["docker", "compose", "up", "-d", "ollama", "ollama-init"], check=True)
          subprocess.run(["docker", "rm", "-f", "shopee-bot-preview"], check=False)
          
          docker_user = os.environ.get("DOCKER_USERNAME") or "local"
          image = f"{docker_user}/shopee-autochat-bot:{os.environ.get('IMAGE_TAG')}"
          
          if docker_user == "local":
              print(f"Building {image} locally for preview because no Docker Hub registry is used...")
              subprocess.run(["docker", "build", "-t", image, "./bot"], check=True)
          else:
              print(f"Pulling {image} from registry...")
              subprocess.run(["docker", "pull", image], check=True)
          
          wk = os.environ.get("GITHUB_WORKSPACE")
          cmd = [
              "docker", "run", "-d",
              "--name", "shopee-bot-preview",
              "--network", "autochat_default",
              "--restart", "unless-stopped",
              "--shm-size=2g",
              "-e", "HEADLESS=false",
              "-e", "POLL_INTERVAL=10",
              "-e", "VNC_PASSWORD=previewpass",
              "-e", "OLLAMA_URL=http://ollama:11434",
              "-v", "shopee-bot-profile-preview:/data/shopee-profile",
              "-v", "shopee-bot-logs-preview:/data/logs",
              "-v", f"{wk}/unanswered_questions.txt:/app/unanswered_questions.txt",
              "-v", f"{wk}/store_knowledge.txt:/app/store_knowledge.txt",
              "-p", "6081:6080",
              image
          ]
          subprocess.run(cmd, check=True)
          print("\nPreview berhasil di-deploy!\nnoVNC: http://<SERVER_IP>:6081")

  # ============================================
  # Cleanup Preview Container
  # ============================================
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: self-hosted
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stop Preview Container
        shell: python
        run: |
          import subprocess
          print("PR closed. Stopping preview container...")
          subprocess.run(["docker", "rm", "-f", "shopee-bot-preview"], check=False)

  # ============================================
  # Job 4: Deploy Production (HANYA push ke main)
  # ============================================
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy to Production
        shell: python
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          import os
          import subprocess
          
          print("Deploying shopee-autochat-bot:latest to production...")
          subprocess.run(["docker", "rm", "-f", "shopee-bot-preview"], check=False)
          
          docker_user = os.environ.get("DOCKER_USERNAME") or "local"
          env_vars = os.environ.copy()
          env_vars["DOCKER_USERNAME"] = docker_user
          env_vars["IMAGE_TAG"] = os.environ.get("IMAGE_TAG")
          
          if docker_user == "local":
              print("Building and deploying locally because no Docker Hub registry is used...")
              subprocess.run(["docker", "compose", "up", "-d", "--build"], env=env_vars, check=True)
          else:
              print("Pulling image from registry and deploying...")
              subprocess.run(["docker", "compose", "pull"], env=env_vars, check=True)
              subprocess.run(["docker", "compose", "up", "-d"], env=env_vars, check=True)
          subprocess.run(["docker", "image", "prune", "-f"], check=False)
          
          print("Deploy production selesai!\nnoVNC: http://<SERVER_IP>:6080")
