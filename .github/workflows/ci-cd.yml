name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]

jobs:
  # ============================================
  # Job 1: Lint & Validasi Python
  # ============================================
  validate:
    if: github.event.action != 'closed'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python & Upgrade Pip
        continue-on-error: true
        run: |
          python --version
          python -m pip install --upgrade pip --break-system-packages

      - name: Install Dependencies
        continue-on-error: true
        run: |
          python -m pip install -r bot/requirements.txt --break-system-packages
          python -m pip install ruff --break-system-packages

      - name: Validasi Kode (Lint)
        run: |
          python -m ruff check bot/

      - name: Jalankan Unit Tests
        run: |
          python -m pytest bot/tests/

  # ============================================
  # Job 2: Build & Push Docker Image
  # ============================================
  build:
    if: github.event.action != 'closed'
    needs: validate
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set Image Tag
        id: tag
        shell: python
        run: |
          import os
          event_name = "${{ github.event_name }}"
          if event_name == "pull_request":
              sha = "${{ github.event.pull_request.head.sha }}"[:7]
              tag = f"pr-${{ github.event.pull_request.number }}-{sha}"
          else:
              sha = "${{ github.sha }}"[:7]
              tag = f"main-{sha}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"IMAGE_TAG={tag}\n")
          print(f"Image tag: {tag}")

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push
        shell: python
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          import os
          import subprocess
          
          docker_user = os.environ.get("DOCKER_USERNAME")
          if not docker_user:
              docker_user = "local"
              
          image = f"{docker_user}/shopee-autochat-bot:{os.environ.get('IMAGE_TAG')}"
          print(f"Building: {image}")
          
          subprocess.run(["docker", "build", "-t", image, "./bot"], check=True)
          
          if docker_user != "local":
              subprocess.run(["docker", "push", image], check=True)
              print(f"Image pushed: {image}")
          else:
              print(f"Skipping push: Docker Hub credentials not configured. Image built locally as {image}")

  # ============================================
  # Job 3: Deploy Preview (HANYA saat PR)
  # ============================================
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: [self-hosted, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy Preview Container
        # ⚠️ PENTING: Jangan gunakan `shell: bash` di sini! Runner Windows (Local System) tidak mendukung WSL.
        # Selalu gunakan `shell: powershell` (Windows PowerShell) atau `shell: python`.
        shell: powershell
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOPEE_USERNAME: ${{ secrets.SHOPEE_USERNAME }}
          SHOPEE_PASSWORD: ${{ secrets.SHOPEE_PASSWORD }}
          AI_PROVIDER: "ollama"
        run: |
          Write-Host "Deploying PR #${{ github.event.pull_request.number }} preview..."
          
          docker ps -q -f name=shopee-bot-preview | ForEach-Object { docker rm -f $_ }
          
          $DOCKER_USER = if ([string]::IsNullOrEmpty($env:DOCKER_USERNAME)) { "local" } else { $env:DOCKER_USERNAME }
          $env:DOCKER_USERNAME = $DOCKER_USER
          
          if ($DOCKER_USER -eq "local") {
              Write-Host "Building locally for preview because no Docker Hub registry is used..."
              docker compose up -d --build
          } else {
              Write-Host "Pulling images from registry..."
              docker compose pull
              docker compose up -d
          }
          docker image prune -f
              
          Write-Host "`nPreview berhasil di-deploy menggunakan docker-compose!"

  # ============================================
  # Cleanup Preview Container
  # ============================================
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: [self-hosted, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop Preview Container
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "PR closed. Stopping preview container using docker-compose..."
          docker ps -q -f name=shopee-bot-preview | ForEach-Object { docker rm -f $_ }
          docker compose down

  # ============================================
  # Job 4: Deploy Production (HANYA push ke main)
  # ============================================
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, 226node2]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy to Production
        shell: python
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: "ollama"
        run: |
          import os
          import subprocess
          import shutil
          
          # Gunakan folder permanen agar file konfigurasi & knowledge base tidak terhapus setelah GH Action selesai
          target_dir = "/home/gpu/actions-runner-autochat/runner-autochat/autochat/autochat"
          os.makedirs(target_dir, exist_ok=True)
          
          # Selalu perbarui docker-compose.yml
          shutil.copy("docker-compose.yml", os.path.join(target_dir, "docker-compose.yml"))
          
          # Jangan timpa file knowledge & questions jika sudah ada di host
          if not os.path.exists(os.path.join(target_dir, "store_knowledge.txt")):
              shutil.copy("store_knowledge.txt", os.path.join(target_dir, "store_knowledge.txt"))
          if not os.path.exists(os.path.join(target_dir, "unanswered_questions.txt")):
              shutil.copy("unanswered_questions.txt", os.path.join(target_dir, "unanswered_questions.txt"))
          
          print("Deploying shopee-autochat-bot:latest to production...")
          subprocess.run(["docker", "rm", "-f", "shopee-bot-preview"], check=False)
          
          docker_user = os.environ.get("DOCKER_USERNAME") or "local"
          env_vars = os.environ.copy()
          env_vars["DOCKER_USERNAME"] = docker_user
          env_vars["IMAGE_TAG"] = os.environ.get("IMAGE_TAG")
          env_vars["GEMINI_API_KEY"] = os.environ.get("GEMINI_API_KEY", "")
          env_vars["AI_PROVIDER"] = os.environ.get("AI_PROVIDER", "ollama")
          
          if docker_user == "local":
              print("Building and deploying locally because no Docker Hub registry is used...")
              subprocess.run(["docker", "compose", "up", "-d", "--build"], env=env_vars, cwd=target_dir, check=True)
          else:
              print("Pulling image from registry and deploying...")
              subprocess.run(["docker", "compose", "pull"], env=env_vars, cwd=target_dir, check=True)
              subprocess.run(["docker", "compose", "up", "-d"], env=env_vars, cwd=target_dir, check=True)
          subprocess.run(["docker", "image", "prune", "-f"], check=False)
          
          print("Deploy production selesai!\nnoVNC: http://<SERVER_IP>:6080")
