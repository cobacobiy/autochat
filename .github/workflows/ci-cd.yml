name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  # ============================================
  # Job 1: Lint & Validasi Python
  # ============================================
  validate:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate or Install Python (Global)
        run: |
          $searchPaths = @(
            "C:\Python311",
            "C:\Python312",
            "C:\Program Files\Python311",
            "C:\Program Files\Python312",
            "C:\Users\acers\AppData\Roaming\uv\python\cpython-3.11.15-windows-x86_64-none",
            "C:\Users\acers\AppData\Local\Python\pythoncore-3.14-64"
          )
          $found = $false
          foreach ($path in $searchPaths) {
            try {
              if (Test-Path "$path\python.exe" -ErrorAction Stop) {
                echo "$path" >> $env:GITHUB_PATH
                if (Test-Path "$path\Scripts" -ErrorAction Stop) {
                  echo "$path\Scripts" >> $env:GITHUB_PATH
                }
                echo "Found Python at $path"
                $found = $true
                break
              }
            } catch {
              echo "Skipping $path due to access/permission restrictions."
            }
          }

          if (-not $found) {
            echo "Python not found. Initiating dynamic global installation..."
            $version = "3.11.9"
            $url = "https://www.python.org/ftp/python/$version/python-$version-amd64.exe"
            $installer = "$env:TEMP\python-installer.exe"
            
            echo "Downloading Python $version from $url..."
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $url -OutFile $installer
            
            echo "Installing Python $version to C:\Python311..."
            $arguments = "/quiet InstallAllUsers=1 TargetDir=C:\Python311 PrependPath=0 AssociateFiles=0 Shortcuts=0 Include_doc=0"
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            
            if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
              Write-Error "Python installation failed with exit code $($process.ExitCode)"
              exit 1
            }
            
            echo "Python installed successfully."
            
            # Verify and add to path
            if (Test-Path "C:\Python311\python.exe") {
              echo "C:\Python311" >> $env:GITHUB_PATH
              if (Test-Path "C:\Python311\Scripts") {
                echo "C:\Python311\Scripts" >> $env:GITHUB_PATH
              }
            } else {
              Write-Error "Python installation directory C:\Python311\python.exe not found after install!"
              exit 1
            }
          }

      - name: Verify Python & Upgrade Pip
        run: |
          python --version
          python -m pip install --upgrade pip --break-system-packages

      - name: Install Linter
        run: python -m pip install ruff --break-system-packages

      - name: Validasi Kode (Lint)
        run: python -m ruff check bot/

  # ============================================
  # Job 2: Build & Push Docker Image
  # - PR        → tag: pr-<number>-<sha7>
  # - Push main → tag: latest
  # ============================================
  build:
    needs: validate
    runs-on: [self-hosted, windows]
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: tag
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $sha = "${{ github.event.pull_request.head.sha }}".Substring(0,7)
            $TAG = "pr-${{ github.event.pull_request.number }}-$sha"
          } else {
            $TAG = "latest"
          }
          echo "IMAGE_TAG=$TAG" >> $env:GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          $DOCKER_USER = $env:DOCKER_USERNAME
          if (-not $DOCKER_USER) { $DOCKER_USER = "local" }
          $IMAGE = "$DOCKER_USER/shopee-autochat-bot:$env:IMAGE_TAG"
          echo "Building: $IMAGE"
          docker build -t "$IMAGE" ./bot
          if ($DOCKER_USER -ne "local") {
            docker push "$IMAGE"
            echo "Image pushed: $IMAGE"
          } else {
            echo "Skipping push: Docker Hub credentials not configured. Image built locally as $IMAGE"
          }

  # ============================================
  # Job 3: Deploy Preview (HANYA saat PR)
  # ============================================
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Preview Container
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          echo "Deploying PR #${{ github.event.pull_request.number }} preview..."

          # Hapus container preview lama
          try { docker rm -f shopee-bot-preview 2>$null } catch {}

          $DOCKER_USER = $env:DOCKER_USERNAME
          if (-not $DOCKER_USER) { $DOCKER_USER = "local" }
          $IMAGE = "$DOCKER_USER/shopee-autochat-bot:$env:IMAGE_TAG"

          # Jalankan container preview (port 6081 supaya tidak bentrok dengan production)
          docker run -d `
            --name shopee-bot-preview `
            --restart unless-stopped `
            --shm-size=2g `
            -e HEADLESS=false `
            -e POLL_INTERVAL=10 `
            -e VNC_PASSWORD=previewpass `
            -v "$PWD/bot-profile-preview:/data/shopee-profile" `
            -v "$PWD/logs-preview:/data/logs" `
            -p 6081:6080 `
            "$IMAGE"

          echo ""
          echo "Preview berhasil di-deploy!"
          echo "noVNC: http://<SERVER_IP>:6081"

  # ============================================
  # Job 4: Deploy Production (HANYA push ke main)
  # ============================================
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "Deploying shopee-autochat-bot:latest to production..."

          # Hapus container preview kalau masih jalan
          try { docker rm -f shopee-bot-preview 2>$null } catch {}

          # Deploy production via docker compose
          $DOCKER_USER = $env:DOCKER_USERNAME
          if (-not $DOCKER_USER) { $DOCKER_USER = "local" }
          $env:DOCKER_USERNAME = $DOCKER_USER
          docker compose up -d --pull always

          # Bersihkan image lama
          docker image prune -f

          echo "Deploy production selesai!"
          echo "noVNC: http://<SERVER_IP>:6080"
