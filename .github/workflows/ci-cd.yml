name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]

jobs:
  # ============================================
  # Job 1: Lint & Validasi Python
  # ============================================
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python & Upgrade Pip
        continue-on-error: true
        run: |
          python --version
          python -m pip install --upgrade pip --break-system-packages

      - name: Install Dependencies
        continue-on-error: true
        run: |
          python -m pip install -r bot/requirements-dev.txt --break-system-packages
          python -m pip install ruff --break-system-packages

      - name: Validasi Kode (Lint)
        run: |
          python -m ruff check bot/

      - name: Jalankan Unit Tests
        run: |
          python -m pytest bot/tests/

  # ============================================
  # Job 2: Build & Push Docker Image
  # ============================================
  build:
    if: github.event.action != 'closed'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set Image Tag
        id: tag
        shell: python
        run: |
          import os
          event_name = "${{ github.event_name }}"
          if event_name == "pull_request":
              sha = "${{ github.event.pull_request.head.sha }}"[:7]
              tag = f"pr-${{ github.event.pull_request.number }}-{sha}"
          else:
              sha = "${{ github.sha }}"[:7]
              tag = f"main-{sha}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"IMAGE_TAG={tag}\n")
          print(f"Image tag: {tag}")

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push
        shell: python
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          import os
          import subprocess
          
          docker_user = os.environ.get("DOCKER_USERNAME")
          if not docker_user:
              docker_user = "local"
              
          image = f"{docker_user}/shopee-autochat-bot:{os.environ.get('IMAGE_TAG')}"
          print(f"Building: {image}")
          
          subprocess.run(["docker", "build", "-t", image, "./bot"], check=True)
          
          # Jika deploy dari main, beri tag latest juga
          image_latest = f"{docker_user}/shopee-autochat-bot:latest"
          if os.environ.get('IMAGE_TAG', '').startswith('main-'):
              subprocess.run(["docker", "tag", image, image_latest], check=True)
              
          if docker_user != "local":
              subprocess.run(["docker", "push", image], check=True)
              print(f"Image pushed: {image}")
              if os.environ.get('IMAGE_TAG', '').startswith('main-'):
                  subprocess.run(["docker", "push", image_latest], check=True)
                  print(f"Image pushed: {image_latest}")
          else:
              print(f"Skipping push: Docker Hub credentials not configured. Image built locally as {image}")

  # ============================================
  # Job 3: Deploy Preview (HANYA saat PR)
  # ============================================
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: [self-hosted, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy Preview Container
        # ⚠️ PENTING: Jangan gunakan `shell: bash` di sini! Runner Windows (Local System) tidak mendukung WSL.
        # Selalu gunakan `shell: powershell` (Windows PowerShell) atau `shell: python`.
        shell: powershell
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOPEE_USERNAME: ${{ secrets.SHOPEE_USERNAME }}
          SHOPEE_PASSWORD: ${{ secrets.SHOPEE_PASSWORD }}
          AI_PROVIDER: "ollama"
        run: |
          Write-Host "Deploying PR #${{ github.event.pull_request.number }} preview..."
          
          docker ps -q -f name=shopee-bot-preview | ForEach-Object { docker rm -f $_ }
          
          $DOCKER_USER = if ([string]::IsNullOrEmpty($env:DOCKER_USERNAME)) { "local" } else { $env:DOCKER_USERNAME }
          $env:DOCKER_USERNAME = $DOCKER_USER
          
          if ($DOCKER_USER -eq "local") {
              Write-Host "Building locally for preview because no Docker Hub registry is used..."
              docker compose up -d --build
          } else {
              Write-Host "Pulling images from registry..."
              docker compose pull
              docker compose up -d
          }
          docker image prune -f
              
          Write-Host "`nPreview berhasil di-deploy menggunakan docker-compose!"

  # ============================================
  # Cleanup Preview Container
  # ============================================
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: [self-hosted, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop Preview Container
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "PR closed. Stopping preview container using docker-compose..."
          docker ps -q -f name=shopee-bot-preview | ForEach-Object { docker rm -f $_ }
          docker compose down

  # ============================================
  # Job 4: Deploy Production (HANYA push ke main)
  # ============================================
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, 226node2]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: "ollama"
          SHOPEE_USERNAME: ${{ secrets.SHOPEE_USERNAME }}
          SHOPEE_PASSWORD: ${{ secrets.SHOPEE_PASSWORD }}
          BOT1_SHOPEE_USERNAME: ${{ secrets.BOT1_SHOPEE_USERNAME }}
          BOT1_SHOPEE_PASSWORD: ${{ secrets.BOT1_SHOPEE_PASSWORD }}
          BOT2_SHOPEE_USERNAME: ${{ secrets.BOT2_SHOPEE_USERNAME }}
          BOT2_SHOPEE_PASSWORD: ${{ secrets.BOT2_SHOPEE_PASSWORD }}
        run: |
          TARGET_DIR="/home/gpu/actions-runner-autochat/runner-autochat/autochat/autochat"
          
          echo "Deploying shopee-autochat-bot:${IMAGE_TAG:-latest} to production..."
          
          # 1. Pastikan folder permanen ada
          mkdir -p "$TARGET_DIR"
          
          # 2. Sinkronisasi file dari repositori ke folder permanen
          #    Exclude .git, .env, store_knowledge.txt, dan unanswered_questions.txt agar data penting tidak tertimpa/terhapus.
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'store_knowledge.txt' \
            --exclude 'unanswered_questions.txt' \
            --exclude 'profiles' \
            --exclude 'logs' \
            ./ "$TARGET_DIR/"
            
          # 3. Pastikan file data eksis (buat kosong jika belum ada)
          touch "$TARGET_DIR/store_knowledge.txt"
          touch "$TARGET_DIR/unanswered_questions.txt"
          
          # 4. Hapus preview container yang mungkin masih menyala
          docker rm -f shopee-bot-preview || true
          
          # 5. Jalankan Docker Compose dari dalam folder permanen
          cd "$TARGET_DIR"
          
          export DOCKER_USERNAME="${DOCKER_USERNAME:-local}"
          
          if [ "$DOCKER_USERNAME" = "local" ]; then
              echo "Building and deploying locally because no Docker Hub registry is used..."
              docker compose up -d --build --remove-orphans
          else
              echo "Pulling image from registry and deploying..."
              docker compose pull
              docker compose up -d --remove-orphans
          fi
          
          docker image prune -f
          
          echo -e "\nDeploy production selesai!\nnoVNC: http://<SERVER_IP>:6080"
