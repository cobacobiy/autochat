name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]

jobs:
  # ============================================
  # Job 1: Lint & Validasi Python
  # ============================================
  validate:
    if: github.event.action != 'closed'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python & Upgrade Pip
        shell: bash
        run: |
          python --version
          python -m pip install --upgrade pip --break-system-packages || python -m pip install --upgrade pip

      - name: Install Linter
        shell: bash
        run: python -m pip install ruff --break-system-packages || python -m pip install ruff

      - name: Validasi Kode (Lint)
        shell: bash
        run: python -m ruff check bot/

  # ============================================
  # Job 2: Build & Push Docker Image
  # ============================================
  build:
    if: github.event.action != 'closed'
    needs: validate
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            sha=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
            TAG="pr-${{ github.event.pull_request.number }}-$sha"
          else
            TAG="latest"
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          DOCKER_USER=${DOCKER_USERNAME:-local}
          IMAGE="$DOCKER_USER/shopee-autochat-bot:$IMAGE_TAG"
          echo "Building: $IMAGE"
          docker build -t "$IMAGE" ./bot
          if [ "$DOCKER_USER" != "local" ]; then
            docker push "$IMAGE"
            echo "Image pushed: $IMAGE"
          else
            echo "Skipping push: Docker Hub credentials not configured. Image built locally as $IMAGE"
          fi

  # ============================================
  # Job 3: Deploy Preview (HANYA saat PR)
  # ============================================
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Preview Container
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          echo "Deploying PR #${{ github.event.pull_request.number }} preview..."

          # Pastikan Ollama berjalan di background untuk preview maupun production
          docker compose up -d ollama ollama-init

          # Hapus container preview lama
          docker rm -f shopee-bot-preview || true

          DOCKER_USER=${DOCKER_USERNAME:-local}
          IMAGE="$DOCKER_USER/shopee-autochat-bot:$IMAGE_TAG"

          # Jalankan container preview (port 6081 supaya tidak bentrok dengan production)
          docker run -d \
            --name shopee-bot-preview \
            --network autochat_default \
            --restart unless-stopped \
            --shm-size=2g \
            -e HEADLESS=false \
            -e POLL_INTERVAL=10 \
            -e VNC_PASSWORD=previewpass \
            -e OLLAMA_URL=http://ollama:11434 \
            -v "shopee-bot-profile-preview:/data/shopee-profile" \
            -v "shopee-bot-logs-preview:/data/logs" \
            -v "${{ github.workspace }}/unanswered_questions.txt:/app/unanswered_questions.txt" \
            -v "${{ github.workspace }}/store_knowledge.txt:/app/store_knowledge.txt" \
            -p 6081:6080 \
            "$IMAGE"

          echo ""
          echo "Preview berhasil di-deploy!"
          echo "noVNC: http://<SERVER_IP>:6081"

  # ============================================
  # Cleanup Preview Container
  # ============================================
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: self-hosted
    steps:
      - name: Stop Preview Container
        shell: bash
        run: |
          echo "PR closed. Stopping preview container..."
          docker rm -f shopee-bot-preview || true

  # ============================================
  # Job 4: Deploy Production (HANYA push ke main)
  # ============================================
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "Deploying shopee-autochat-bot:latest to production..."

          # 1. Matikan & Hapus container preview agar tidak berebut akun Shopee
          docker rm -f shopee-bot-preview || true

          # 2. Deploy production via docker compose
          DOCKER_USER=${DOCKER_USERNAME:-local}
          export DOCKER_USERNAME=$DOCKER_USER
          docker compose up -d

          # Bersihkan image lama
          docker image prune -f

          echo "Deploy production selesai!"
          echo "noVNC: http://<SERVER_IP>:6080"
