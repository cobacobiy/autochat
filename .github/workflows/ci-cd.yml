name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  # ============================================
  # Job 1: Lint & Validasi Python
  # ============================================
  validate:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate and Add Python to PATH
        run: |
          $searchPaths = @(
            "C:\Users\acers\AppData\Roaming\uv\python\cpython-3.11.15-windows-x86_64-none",
            "C:\Users\acers\AppData\Local\Python\pythoncore-3.14-64",
            "C:\Python312",
            "C:\Python311",
            "C:\Program Files\Python312",
            "C:\Program Files\Python311"
          )
          $found = $false
          foreach ($path in $searchPaths) {
            if (Test-Path "$path\python.exe") {
              echo "$path" >> $env:GITHUB_PATH
              if (Test-Path "$path\Scripts") {
                echo "$path\Scripts" >> $env:GITHUB_PATH
              }
              echo "Found Python at $path"
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Error "Could not find python.exe in standard search paths!"
            exit 1
          }

      - name: Verify Python & Upgrade Pip
        run: |
          python --version
          python -m pip install --upgrade pip

      - name: Install Linter
        run: pip install ruff

      - name: Validasi Kode (Lint)
        run: ruff check bot/

  # ============================================
  # Job 2: Build & Push Docker Image
  # - PR        → tag: pr-<number>-<sha7>
  # - Push main → tag: latest
  # ============================================
  build:
    needs: validate
    runs-on: [self-hosted, windows]
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: tag
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $sha = "${{ github.event.pull_request.head.sha }}".Substring(0,7)
            $TAG = "pr-${{ github.event.pull_request.number }}-$sha"
          } else {
            $TAG = "latest"
          }
          echo "IMAGE_TAG=$TAG" >> $env:GITHUB_OUTPUT
          echo "📦 Image tag: $TAG"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          $IMAGE = "$env:DOCKER_USERNAME/shopee-autochat-bot:$env:IMAGE_TAG"
          echo "🚀 Building: $IMAGE"
          docker build -t "$IMAGE" ./bot
          docker push "$IMAGE"
          echo "✅ Image pushed: $IMAGE"

  # ============================================
  # Job 3: Deploy Preview (HANYA saat PR)
  # ============================================
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Preview Container
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          echo "🔍 Deploying PR #${{ github.event.pull_request.number }} preview..."

          # Hapus container preview lama
          try { docker rm -f shopee-bot-preview 2>$null } catch {}

          # Jalankan container preview (port 6081 supaya tidak bentrok dengan production)
          docker run -d `
            --name shopee-bot-preview `
            --restart unless-stopped `
            --shm-size=2g `
            -e HEADLESS=false `
            -e POLL_INTERVAL=10 `
            -e VNC_PASSWORD=previewpass `
            -v "$PWD/bot-profile-preview:/data/shopee-profile" `
            -v "$PWD/logs-preview:/data/logs" `
            -p 6081:6080 `
            "$env:DOCKER_USERNAME/shopee-autochat-bot:$env:IMAGE_TAG"

          echo ""
          echo "✅ Preview berhasil di-deploy!"
          echo "🖥️  noVNC: http://<SERVER_IP>:6081"

  # ============================================
  # Job 4: Deploy Production (HANYA push ke main)
  # ============================================
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "🚀 Deploying shopee-autochat-bot:latest to production..."

          # Hapus container preview kalau masih jalan
          try { docker rm -f shopee-bot-preview 2>$null } catch {}

          # Deploy production via docker compose
          docker compose up -d --pull always

          # Bersihkan image lama
          docker image prune -f

          echo "✅ Deploy production selesai!"
          echo "🖥️  noVNC: http://<SERVER_IP>:6080"
